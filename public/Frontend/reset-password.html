<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900|Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <img src="../assets/rz.png" alt="Tu Logo" class="logo">
</head>
<body>
    <div class="container">
        <h1>New Password</h1>
        <p>Your new password must be different from previously used one, and must have at least 8 characters.</p>
        <form id="resetPasswordForm">
            <input type="hidden" id="token" name="token">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required placeholder="**********" minlength="8" maxlength="20">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="**********" minlength="8" maxlength="20">
            </div>
            <button type="submit">Reset Password</button>
            <div id="resetPasswordMessage" class="message"></div>
        </form>
    </div>

    <script src="../Frontend/JS/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          const urlParams = new URLSearchParams(window.location.search);
          const token = urlParams.get('token');
          const tokenInput = document.getElementById('token'); // Asegúrate de tener un input oculto con este ID
      
          if (token && tokenInput) {
            tokenInput.value = token;
          } else {
            console.error('No se encontró el token en la URL o el campo de token no existe.');
            // Podrías mostrar un mensaje de error al usuario aquí
          }
        });
      </script>
</body>
</html>
