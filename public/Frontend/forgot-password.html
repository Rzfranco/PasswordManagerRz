<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900|Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <img src="../assets/rz.png" alt="Tu Logo" class="logo">
</head>
<body>
    <div class="container">
        <h1>¿Forgot Password?</h1>
        <p class="email">Enter your email and we'll send you a link to reset your password</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required placeholder="email@gmail.com">
            </div>
            <button type="submit">Reset Password</button>
            <p>Go back here to <a href="./login.html">Sign in </a></p>
            <div id="forgotPasswordMessage" class="message"></div>
        </form>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
